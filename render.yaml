services:
  - type: web
    name: sf-dgci-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        value: aws-0-eu-west-3.pooler.supabase.com
      - key: DB_PORT
        value: 6543
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.uevcnikysmavobstplvo
      - key: DB_PASSWORD
        sync: false   # ⚠️ Definir manualmente no Render Dashboard
      - key: JWT_SECRET
        sync: false   # ⚠️ Definir manualmente no Render Dashboard
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://sindicato-dgci.free.nf
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: sindicatodgci@gmail.com
      - key: SMTP_PASS
        sync: false   # ⚠️ Definir manualmente no Render Dashboard
